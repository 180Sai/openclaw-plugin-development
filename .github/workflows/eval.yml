name: Grounding Eval

on:
  schedule:
    # Every 6 hours: catches live drift of the grounding benchmark.
    - cron: "17 */6 * * *"
  pull_request:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: search-cite

jobs:
  eval:
    name: Grounding-score drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: search-cite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run grounding eval
        run: npm run eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-eval-report
          path: search-cite/evals/report.json
          if-no-files-found: ignore
